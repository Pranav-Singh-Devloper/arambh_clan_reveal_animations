    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.2 20.4 5.2v6.4c0 4.8-3.6 8.7-8.4 10.2-4.8-1.5-8.4-5.4-8.4-10.2V5.2Z' fill='%23CC0033'/%3E%3Cpath d='M12 7.4l1.4 2.9 2.9 1.4-2.9 1.4L12 16l-1.4-2.9-2.9-1.4 2.9-1.4Z' fill='%23FFE5CD'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Bodoni Moda is the historical playbill/marquee face: very high stroke
       contrast, which is what reads as expensive at display sizes. Inter
       carries everything small, where Bodoni's hairlines would fall apart.

       Tiro Devanagari Hindi carries the war cries. Three of the four are in
       Devanagari and Bodoni has no Devanagari glyphs at all, so without this
       the biggest line on three of the eight pages would have dropped to
       whatever the device happens to default to - Noto on one phone, a system
       UI face on the next - beside Bodoni. Tiro is a high-contrast Devanagari
       text serif designed to set alongside Latin serifs, which is exactly the
       job: Maratha's cry is a single line of both scripts at once. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap"
    rel="stylesheet" />
